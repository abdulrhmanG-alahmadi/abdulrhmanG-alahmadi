<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
<title id="title">Leadline</title><desc id="desc">Local business discovery. Bun · Elysia · Vite.</desc>
<style>
@keyframes f400 {to {transform:translateX(-400px)}}
@keyframes f200 {to {transform:translateX(-200px)}}
@keyframes f300 {to {transform:translateX(-300px)}}
@keyframes pulse {0%,100% {opacity:1;transform:scale(1)} 50% {opacity:.35;transform:scale(.6)}}
.w1 {animation:f400 14s linear -3s infinite}
.w2 {animation:f200 7s linear -3s infinite}
.w3 {animation:f300 10s linear -3s infinite}
.dot {transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out -1.0s infinite}
@media (prefers-reduced-motion:reduce) {.w1,.w2,.w3,.dot {animation:none}}
</style>
