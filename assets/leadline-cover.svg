<path class="w2" d="M0 246 q50.0 -14 100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0" fill="none" stroke="#57bfff" stroke-opacity=".55" stroke-width="1.5"/>
