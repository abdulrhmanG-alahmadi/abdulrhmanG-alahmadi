<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">EduVision processing pipeline</title><desc id="desc">MP4 frames pass through person detection and crops, then head pose and raised-hand heuristics, phone detection and summary charts. Architecture illustration, not measured output.</desc>
<style>
@keyframes lit {0%,100% {stroke:#b9d3ee;fill:#e4effb} 6%,22% {stroke:#0869bf;fill:#d6e8fb} 30% {stroke:#b9d3ee;fill:#e4effb}}
@keyframes nudge {0%,100% {transform:translateX(0);opacity:.45} 50% {transform:translateX(5px);opacity:1}}
@keyframes scan {0% {transform:scaleX(0)} 92% {transform:scaleX(1);opacity:1} 100% {transform:scaleX(1);opacity:0}}
.card {animation:lit 8s ease-in-out infinite}
.c2 {animation-delay:2s}.c3 {animation-delay:4s}.c4 {animation-delay:6s}
.arrow {animation:nudge 2s ease-in-out infinite;transform-box:fill-box}
.scan {transform-origin:48px 0;animation:scan 8s linear infinite}
@media (prefers-reduced-motion:reduce) {.card,.arrow,.scan {animation:none}}
</style>
<rect width="1200" height="360" rx="16" fill="#f4f9ff"/>
<g font-family="Arial,sans-serif"><text x="48" y="48" fill="#0869bf" font-size="14" letter-spacing="3">EDUVISION / INSIDE THE PIPELINE</text><text x="48" y="93" fill="#092758" font-size="27">From video frames to visible activity summaries</text>
<rect class="card c1" x="48" y="135" width="252" height="126" rx="12" fill="#e4effb" stroke="#b9d3ee"/><text x="68" y="164" fill="#0869bf" font-size="14">01</text><text x="68" y="201" fill="#092758" font-size="22">MP4 frames</text><text x="68" y="234" fill="#466487" font-size="15">Sample the recording</text><path class="arrow" d="M308 197h17m-6-5 6 5-6 5" fill="none" stroke="#0869bf" stroke-width="2"/><rect class="card c2" x="332" y="135" width="252" height="126" rx="12" fill="#e4effb" stroke="#b9d3ee"/><text x="352" y="164" fill="#0869bf" font-size="14">02</text><text x="352" y="201" fill="#092758" font-size="22">People &amp; crops</text><text x="352" y="234" fill="#466487" font-size="15">Faster R-CNN</text><path class="arrow" d="M592 197h17m-6-5 6 5-6 5" fill="none" stroke="#0869bf" stroke-width="2"/><rect class="card c3" x="616" y="135" width="252" height="126" rx="12" fill="#e4effb" stroke="#b9d3ee"/><text x="636" y="164" fill="#0869bf" font-size="14">03</text><text x="636" y="201" fill="#092758" font-size="22">Pose &amp; phones</text><text x="636" y="234" fill="#466487" font-size="15">MediaPipe + detection</text><path class="arrow" d="M876 197h17m-6-5 6 5-6 5" fill="none" stroke="#0869bf" stroke-width="2"/><rect class="card c4" x="900" y="135" width="252" height="126" rx="12" fill="#e4effb" stroke="#b9d3ee"/><text x="920" y="164" fill="#0869bf" font-size="14">04</text><text x="920" y="201" fill="#092758" font-size="22">Visual summaries</text><text x="920" y="234" fill="#466487" font-size="15">Saved crops + charts</text><rect x="48" y="277" width="1104" height="2" rx="1" fill="#e4effb"/><rect class="scan" x="48" y="277" width="1104" height="2" rx="1" fill="#0869bf"/><text x="48" y="316" fill="#466487" font-size="16">Research prototype · Architecture illustration · No attention or learning benchmark</text></g></svg>