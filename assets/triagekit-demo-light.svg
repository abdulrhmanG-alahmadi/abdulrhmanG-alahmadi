<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" role="img" aria-labelledby="title desc">
<title id="title">TriageKit recorded offline API demo</title><desc id="desc">A synthetic invoice question was accepted with HTTP 201, moved from pending to classified, and returned category billing, priority medium, model fake-v1. Visual replay of captured output, not a live model benchmark.</desc>
<style>
@keyframes type {0%,4% {transform:translateX(0)} 34%,100% {transform:translateX(511px)}}
@keyframes blink {0%,49% {opacity:1} 50%,100% {opacity:0}}
@keyframes scene {0%,93% {opacity:1} 98%,100% {opacity:0}}
@keyframes status {0%,38% {opacity:0} 42%,100% {opacity:1}}
@keyframes moved {0%,48% {opacity:0} 52%,100% {opacity:1}}
.cover {animation:type 11s steps(37,end) infinite}
.caret {animation:blink 1s step-end infinite}
.scene {animation:scene 11s ease-in-out infinite}
.status {animation:status 11s ease-out infinite}
.moved {animation:moved 11s ease-out infinite}
.r1,.r2,.r3 {animation:11s cubic-bezier(.2,.8,.2,1) infinite}
.r1 {animation-name:r1}.r2 {animation-name:r2}.r3 {animation-name:r3}
@keyframes r1 {0%,56% {opacity:0;transform:translateY(10px)} 61%,100% {opacity:1;transform:translateY(0)}}
@keyframes r2 {0%,62% {opacity:0;transform:translateY(10px)} 67%,100% {opacity:1;transform:translateY(0)}}
@keyframes r3 {0%,68% {opacity:0;transform:translateY(10px)} 73%,100% {opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce) {.cover {display:none} .scene,.status,.moved,.r1,.r2,.r3 {animation:none;opacity:1}}
</style>
<rect width="1000" height="370" rx="16" fill="#f4f9ff"/>
<rect width="1000" height="52" rx="16" fill="#e4effb"/>
<g font-family="Arial,sans-serif"><text x="32" y="34" fill="#466487" font-size="17">TriageKit / captured API output / offline fake provider</text></g>
<g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="23">
<text x="32" y="98" fill="#0869bf">POST /api/v1/tickets</text>
<g class="scene">
<text x="32" y="140" fill="#092758" textLength="511" lengthAdjust="spacingAndGlyphs">Where can I download my July invoice?</text>
<g class="status"><text x="32" y="187" fill="#466487" textLength="321" lengthAdjust="spacingAndGlyphs">201 Created  /  pending</text></g>
<g class="moved"><text x="367" y="187" fill="#466487" textLength="165" lengthAdjust="spacingAndGlyphs">→ classified</text></g>
<g class="r1"><text x="32" y="246" fill="#0a7f5c">category: billing</text></g>
<g class="r2"><text x="350" y="246" fill="#0a7f5c">priority: medium</text></g>
<g class="r3"><text x="32" y="286" fill="#466487">model: fake-v1  /  attempts: 1</text></g>
</g>
</g>
<g class="cover"><rect x="30" y="112" width="640" height="38" fill="#f4f9ff"/><rect class="caret" x="31" y="118" width="3" height="27" fill="#0869bf"/></g>
<text x="32" y="342" fill="#6a86a6" font-family="Arial,sans-serif" font-size="16">Synthetic input · Visual replay of recorded output · Animation timing is illustrative</text></svg>
